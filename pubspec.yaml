name: auth_ui_demo
description: "Красивый UI авторизации"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  # Основные пакеты с фиксированными версиями
  cupertino_icons: ^1.0.5
  supabase_flutter: ^2.1.3
  cached_network_image: ^3.3.0
  url_launcher: ^6.1.15
  shared_preferences: ^2.2.2
  webview_flutter: ^4.4.2
  flutter_dotenv: ^5.1.0
  http: ^1.1.0
  path_provider: ^2.1.1
  flutter_pdfview: ^1.3.2
  epubx: ^3.0.0
  flutter_widget_from_html_core: ^0.10.0
  pdfx: ^2.4.0
  dio: ^5.4.0
  image_picker: ^1.0.7
  google_fonts: ^8.0.2
  flutter_staggered_grid_view: ^0.7.0



  # Уберите если не используете:
  # advanced_pdf_viewer: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/onboard_screens/
    - .env